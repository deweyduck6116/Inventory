    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Pick List Generator</title>

    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px; background-color: #f0f4f8; color: #1a202c; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #2d3748; border-left: 5px solid #38a169; padding-left: 15px; margin-bottom: 5px; }
        
        .setup-container { height: 110px; margin-bottom: 20px; }
        .setup-box { background: #edf2f7; border-radius: 8px; padding: 20px; }

        .prefill-btn { background: #4a5568; color: white; padding: 8px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; display: block; }

        /* FIXED GRID: Increased width to 280px to accommodate the extra spaces */
        .entry-grid { 
            display: grid; 
            grid-template-columns: 115px 280px 75px 50px 50px; 
            gap: 12px; 
            align-items: center; 
            margin-bottom: 12px;
        }

        .header-grid { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #4a5568; }
        .col-item { text-align: left; }
        .col-pkg   { text-align: center; }
        .col-qty   { text-align: center; }

        .item-input { width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .qty-input { width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 6px; font-size: 16px; text-align: center; box-sizing: border-box; }
        
        .info-badge { font-size: 12px; color: #4a5568; background: #e2e8f0; padding: 0 10px; border-radius: 6px; white-space: nowrap; height: 48px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }

        button { cursor: pointer; border: none; border-radius: 6px; font-weight: 600; }
        .add-btn { background: #3182ce; color: white; width: 45px; height: 45px; font-size: 24px; }
        .rem-btn { background: #e53e3e; color: white; width: 45px; height: 45px; font-size: 24px; }
        .process-btn { background: #38a169; color: white; width: 100%; padding: 18px; font-size: 18px; margin-top: 20px; }
        .save-btn { background: #805ad5; color: white; padding: 8px 15px; margin-top: 10px; font-size: 12px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 1px solid black; }
        th, td { border: 1px solid black; padding: 12px; text-align: left; }
        th { background: #2d3748; color: white; }
        .loc-cell { font-family: monospace; font-weight: 800; color: #2f855a; background: #f0fff4; }
        .page-break { page-break-before: always; border-top: 2px dashed #cbd5e0; margin-top: 50px; padding-top: 20px; }

        @media print { .no-print { display: none !important; } .page-break { border-top: none; } }
    </style>
</head>

        <div id="main-entry-list">

                <input type="text" class="qty-input" maxlength="3">
                <button class="add-btn" onclick="addInput()">+</button>
                <div></div>
            </div>
        </div>
    </div>

    <button class="process-btn no-print" onclick="processData()">GENERATE LIST</button>
    <div id="results"></div>
</div>

    window.onload = function() {
        if (rawData.length > 0) {
            const area = document.getElementById('setup-area');
            if(area) area.style.visibility = 'hidden'; 
        }
    };

    function findHeader(row, aliases) {
        if (!row) return null;
        const keys = Object.keys(row);
        for (let alias of aliases) {
            const found = keys.find(k => k.trim().toLowerCase() === alias.toLowerCase());
            if (found) return found;
        }
        return null;
    }

    function autoPopulate(inputEl) {
        if (rawData.length === 0) return;
        const badge = inputEl.nextElementSibling;
        const val = inputEl.value.trim();
        const firstRow = rawData[0];
        const kItemNum = findHeader(firstRow, ['item_num', 'item #']);
        const kEachPer = findHeader(firstRow, ['each_per_bx/pkg/sleeve', 'each per']);
        const kBxCase  = findHeader(firstRow, ['bx/pkg/sleeve_per_case', 'bx/pkg']);
        const kParLoc  = findHeader(firstRow, ['par_loc']);
        const kMaxCase = findHeader(firstRow, ['MAX per Shelf']);

        const match = rawData.find(row => 
            String(row[kItemNum] || '').trim() === val && 
            String(row[kParLoc] || '').trim() === "C-DIST"
        );

        if (match) {
            badge.innerHTML = `Qty\\Pkg: <b> ${match[kEachPer] || '0'} </b> | Qty\\Case: <b> ${match[kBxCase] || '0'} </b> | Max Case: <b> ${match[kMaxCase] || '0'} </b>`;
            badge.style.background = "#c6f6d5";
        } else {
            badge.innerHTML = `Qty\\Pkg: -- | Qty\\Case: -- | Max Case: --`;
            badge.style.background = "#e2e8f0";
        }
    }

    document.getElementById('fileUpload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                document.getElementById('saveBtn').style.display = 'inline-block';
            } catch (err) { console.error("Error reading file."); }
        };
        reader.readAsArrayBuffer(file);
    });

    function generateEmbeddedFile() {
        const dataString = JSON.stringify(rawData);
        let newHtml = document.documentElement.outerHTML;
        newHtml = newHtml.replace(/let rawData = \[\];/, `let rawData = ${dataString};`);
        const blob = new Blob([newHtml], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'WHSE_PT_W_Data.html';
        link.click();
    }

    function addInput(itemVal = "", pkgHtml = "Qty\\Pkg: -- | Qty\\Case: -- | Max Case: --", bg = "#e2e8f0") {
        const container = document.getElementById('main-entry-list');
        const div = document.createElement('div');
        div.className = 'entry-grid';
        div.innerHTML = `
            <input type="text" class="item-input" maxlength="12" oninput="autoPopulate(this)" value="${itemVal}">
            <span class="info-badge" style="background:${bg}">${pkgHtml}</span>
            <input type="text" class="qty-input" maxlength="3">
            <button class="rem-btn" onclick="this.parentElement.remove()">×</button>
            <button class="add-btn" onclick="addInput()">+</button>
        `;
        container.appendChild(div);
        if(!itemVal) div.querySelector('input').focus();
    }

    function preFillAll() {
        if (rawData.length === 0) return alert("Upload a file first.");
        const container = document.getElementById('main-entry-list');
        container.innerHTML = ""; 

        const firstRow = rawData[0];
        const kItemNum = findHeader(firstRow, ['item_num', 'item #']);
        const kWhse    = findHeader(firstRow, ['WHSE_LOC', 'WHSE_', 'WHSE']);
        const kParLoc  = findHeader(firstRow, ['par_loc']);
        const kEachPer = findHeader(firstRow, ['each_per_bx/pkg/sleeve', 'each per']);
        const kBxCase  = findHeader(firstRow, ['bx/pkg/sleeve_per_case', 'bx/pkg']);
        const kMaxCase = findHeader(firstRow, ['MAX per Shelf']);

        rawData.forEach(row => {
            const item = String(row[kItemNum] || '').trim();
            const loc = String(row[kWhse] || '').trim();
            const par = String(row[kParLoc] || '').trim();

            if (item && loc && loc !== "N/A" && par === "C-DIST") {
                const pkgText = `Qty\\Pkg: <b> ${row[kEachPer] || '0'} </b> | Qty\\Case: <b> ${row[kBxCase] || '0'} </b> | Max Case: <b> ${row[kMaxCase] || '0'} </b>`;
                addInput(item, pkgText, "#c6f6d5");
            }
        });
    }

    function processData() {
        if (rawData.length === 0) return alert("Upload a file first.");
        const rows = Array.from(document.querySelectorAll('#main-entry-list .entry-grid'));
        const requestMap = {};
        rows.forEach(row => {
            const item = row.querySelector('.item-input').value.trim();
            const qty = row.querySelector('.qty-input').value.trim();
            if (item) requestMap[item] = qty;
        });

        const userItems = Object.keys(requestMap);
        const firstRow = rawData[0];
        const keys = {
            itemNum:  findHeader(firstRow, ['item_num', 'item #']),
            itemDesc: findHeader(firstRow, ['item_desc', 'description']),
            whse:      findHeader(firstRow, ['WHSE_LOC', 'WHSE_', 'WHSE']),
            reqBin:    findHeader(firstRow, ['req_bin']),
            eachPer:  findHeader(firstRow, ['each_per_bx/pkg/sleeve', 'each per']),
            bxCase:    findHeader(firstRow, ['bx/pkg/sleeve_per_case', 'bx/pkg']),
            parLoc:    findHeader(firstRow, ['par_loc']),
            maxCases:  findHeader(firstRow, ['MAX per Shelf'])
        };

        const matches = rawData.filter(row => 
            userItems.includes(String(row[keys.itemNum] || '').trim()) &&
            String(row[keys.parLoc] || '').trim() === "C-DIST"
        );

        const sortWhse = [...matches].sort((a, b) => String(a[keys.whse] || '').localeCompare(String(b[keys.whse] || ''), undefined, {numeric: true}));
        const sortBin = [...matches].sort((a, b) => String(a[keys.reqBin] || '').localeCompare(String(b[keys.reqBin] || ''), undefined, {numeric: true}));

        renderDualTables(sortWhse, sortBin, keys, requestMap);
    }

    function createTableHTML(data, k, requestMap, title) {
        let html = `<h3>${title} (${data.length} Items)</h3>
                    <table><thead><tr>
                        <th>WHSE Location</th><th>Item #</th><th>Description</th>
                        <th>Pull Qty</th><th>Req Bin</th><th>Ea/Pkg</th><th>Pkg/Case</th><th>Max Cases</th>
                    </tr></thead><tbody>`;
        data.forEach(row => {
            const itemKey = String(row[k.itemNum] || '').trim();
            let loc = String(row[k.whse] || 'N/A').replace(/WHSE-/gi, "");
            html += `<tr><td class="loc-cell">${loc}</td><td><strong>${itemKey}</strong></td><td>${row[k.itemDesc] || ''}</td><td style="font-weight:bold; color:#d9534f; font-size:1.2em;">${requestMap[itemKey] || ''}</td><td>${row[k.reqBin] || ''}</td><td>${row[k.eachPer] || ''}</td><td>${row[k.bxCase] || ''}</td><td>${row[k.maxCases] || ''}</td></tr>`;
        });
        return html + "</tbody></table>";
    }

    function renderDualTables(dataWhse, dataBin, k, requestMap) {
        const printBtn = `<div style="display:flex; justify-content:flex-end; margin-top:30px;" class="no-print"><button onclick="window.print()" style="padding:10px 20px; background:#4a5568; color:white;">PRINT TO PRINTER</button></div>`;
        const t1 = createTableHTML(dataWhse, k, requestMap, "Pick List (By Warehouse)");
        const t2 = createTableHTML(dataBin, k, requestMap, "Pick List (By Req Bin)");
        document.getElementById('results').innerHTML = printBtn + t1 + `<div class="page-break"></div>` + t2;
    }
</script>
